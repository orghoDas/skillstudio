name: Application checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skillstudio
          POSTGRES_PASSWORD: local-ci-db
          POSTGRES_DB: skillstudio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillstudio -d skillstudio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEBUG: "True"
      DATABASE_URL: "postgresql://skillstudio:local-ci-db@127.0.0.1:5432/skillstudio"
      TEST_DATABASE_URL: "postgresql://skillstudio:local-ci-db@127.0.0.1:5432/skillstudio"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - run: python -m pip install ruff==0.15.0
      - run: ruff check --select F accounts assessments certificates core courses enrollments exams instructors payments skillstudio students --exclude migrations
      - run: python -m playwright install --with-deps chromium
      - name: Verify the checked-in Tailwind CSS
        run: |
          npm ci --ignore-scripts
          npm run build:css
          git diff --exit-code -- static/css/app.css
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pip-audit==2.10.0
      - run: python -m pip_audit --requirement requirements.txt --require-hashes --disable-pip
