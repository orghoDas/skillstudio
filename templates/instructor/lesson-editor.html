{% extends 'base.html' %}

{% block title %}Edit Lesson - SkillStudio{% endblock %}

{% block extra_css %}
<style>
    .editor-toolbar {
        background: rgba(30, 41, 59, 0.5);
        border: 1px solid rgba(71, 85, 105, 0.3);
        border-radius: 0.5rem 0.5rem 0 0;
        padding: 0.5rem;
        display: flex;
        gap: 0.25rem;
        flex-wrap: wrap;
    }
    .editor-toolbar button {
        padding: 0.5rem;
        background: transparent;
        color: #94a3b8;
        border: none;
        border-radius: 0.375rem;
        cursor: pointer;
        transition: all 0.2s;
    }
    .editor-toolbar button:hover {
        background: rgba(59, 130, 246, 0.1);
        color: #3b82f6;
    }
    .editor-content {
        background: #0f172a;
        border: 1px solid rgba(71, 85, 105, 0.3);
        border-top: none;
        border-radius: 0 0 0.5rem 0.5rem;
        padding: 1rem;
        min-height: 400px;
        color: #e2e8f0;
        font-family: inherit;
    }
    .editor-content:focus {
        outline: none;
        border-color: #3b82f6;
    }
    .quiz-question {
        background: rgba(30, 41, 59, 0.5);
        border: 1px solid rgba(71, 85, 105, 0.3);
        border-radius: 0.5rem;
        padding: 1rem;
        margin-bottom: 1rem;
    }
    .quiz-option {
        background: rgba(15, 23, 42, 0.5);
        border: 1px solid rgba(71, 85, 105, 0.3);
        border-radius: 0.375rem;
        padding: 0.75rem;
        margin-bottom: 0.5rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }
    .quiz-option.correct {
        border-color: #10b981;
        background: rgba(16, 185, 129, 0.1);
    }
</style>
{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto px-4 py-8">
    <!-- Header -->
    <div class="mb-8">
        <div class="flex items-center justify-between mb-4">
            <div>
                <a href="#" data-click="goBack" class="text-blue-400 hover:text-blue-300 text-sm mb-2 inline-block">
                    ← Back to Course Content
                </a>
                <h1 class="text-3xl font-bold" id="lesson-title-display">Edit Lesson</h1>
                <p class="text-gray-400 mt-2" id="lesson-meta">Loading...</p>
            </div>
            <div class="flex items-center space-x-3">
                <button data-click="saveDraft" class="px-6 py-3 bg-dark-surface border border-dark-border hover:bg-dark-hover text-white rounded-lg font-semibold transition-colors">
                    Save Draft
                </button>
                <button data-click="saveContent" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold transition-colors">
                    Save & Publish
                </button>
            </div>
        </div>
    </div>

    <!-- Lesson Basic Info -->
    <div class="bg-dark-surface border border-dark-border rounded-lg p-6 mb-6">
        <h2 class="text-xl font-semibold mb-4">Lesson Information</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label for="lesson-title" class="block text-sm font-medium mb-2">Lesson Title</label>
                <input type="text" id="lesson-title" class="w-full px-4 py-3 bg-dark-bg border border-dark-border rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="lesson-type" class="block text-sm font-medium mb-2">Content Type</label>
                <select id="lesson-type" data-change="switchContentType" class="w-full px-4 py-3 bg-dark-bg border border-dark-border rounded-lg focus:ring-2 focus:ring-blue-500">
                    <option value="video">Video</option>
                    <option value="text">Article</option>
                    <option value="quiz">Quiz</option>
                </select>
            </div>
            <div>
                <label for="lesson-duration" class="block text-sm font-medium mb-2">Duration (minutes)</label>
                <input type="number" id="lesson-duration" min="0" class="w-full px-4 py-3 bg-dark-bg border border-dark-border rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex items-center pt-8">
                <input type="checkbox" id="lesson-is-free" class="w-4 h-4 text-blue-600 bg-dark-bg border-dark-border rounded focus:ring-2 focus:ring-blue-500">
                <label for="lesson-is-free" class="ml-3 text-sm font-medium">Free preview</label>
            </div>
        </div>
    </div>

    <!-- Content Editor (Dynamic based on type) -->
    <div id="content-editor-container">
        <!-- Will be populated by JavaScript -->
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script nonce="{{ csp_nonce }}">
let lessonId;
let lessonData = {};

document.addEventListener('DOMContentLoaded', function() {
    // Get lesson ID from URL
    const pathParts = window.location.pathname.split('/');
    lessonId = pathParts[3];
    
    loadLessonData();
});

async function loadLessonData() {
    try {
        const response = await apiRequest(`/courses/lessons/${lessonId}/`);
        lessonData = response;
        
        // Populate basic info
        document.getElementById('lesson-title').value = lessonData.title || '';
        document.getElementById('lesson-type').value = lessonData.content_type || 'video';
        document.getElementById('lesson-duration').value = Math.round((lessonData.duration_seconds || 0) / 60);
        document.getElementById('lesson-is-free').checked = lessonData.is_free || false;
        
        // Update header
        document.getElementById('lesson-title-display').textContent = lessonData.title || 'Edit Lesson';
        document.getElementById('lesson-meta').textContent = `${lessonData.content_type} · ${Math.round((lessonData.duration_seconds || 0) / 60)} minutes`;
        
        // Load content editor based on type
        switchContentType();
        
    } catch (error) {
        console.error('Error loading lesson:', error);
        showAlert('Failed to load lesson data', 'error');
    }
}

function switchContentType() {
    const contentType = document.getElementById('lesson-type').value;
    const container = document.getElementById('content-editor-container');
    
    switch(contentType) {
        case 'video':
            container.innerHTML = renderVideoEditor();
            loadVideoContent();
            break;
        case 'text':
            container.innerHTML = renderTextEditor();
            loadTextContent();
            break;
        case 'quiz':
            container.innerHTML = renderQuizEditor();
            loadQuizContent();
            break;
    }
}

function renderVideoEditor() {
    return `
        <div class="bg-dark-surface border border-dark-border rounded-lg p-6">
            <h2 class="text-xl font-semibold mb-4">Video Content</h2>
            
            <div class="mb-6">
                <label for="video-url" class="block text-sm font-medium mb-2">Video URL</label>
                <input type="url" id="video-url" placeholder="https://www.youtube.com/watch?v=..." 
                    class="w-full px-4 py-3 bg-dark-bg border border-dark-border rounded-lg focus:ring-2 focus:ring-blue-500">
                <p class="text-xs text-gray-400 mt-2">Supports YouTube, Vimeo, and direct video links</p>
            </div>
            
            <div id="video-preview" class="hidden mb-6">
                <label class="block text-sm font-medium mb-2">Preview</label>
                <div class="aspect-video bg-dark-bg border border-dark-border rounded-lg overflow-hidden">
                    <iframe id="video-iframe" title="Video preview" class="w-full h-full" allowfullscreen></iframe>
                    <video id="video-file" class="hidden w-full h-full" controls preload="metadata"></video>
                </div>
            </div>
            
            <div>
                <label for="video-description" class="block text-sm font-medium mb-2">Description</label>
                <textarea id="video-description" rows="6" placeholder="Describe what students will learn in this video..."
                    class="w-full px-4 py-3 bg-dark-bg border border-dark-border rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
            </div>
        </div>
    `;
}

function renderTextEditor() {
    return `
        <div class="bg-dark-surface border border-dark-border rounded-lg p-6">
            <h2 class="text-xl font-semibold mb-4">Article Content</h2>
            
            <div class="editor-toolbar">
                <button data-click="formatText" data-value-one="bold" data-value-two="" title="Bold"><b>B</b></button>
                <button data-click="formatText" data-value-one="italic" data-value-two="" title="Italic"><i>I</i></button>
                <button data-click="formatText" data-value-one="underline" data-value-two="" title="Underline"><u>U</u></button>
                <span class="border-l border-dark-border mx-1"></span>
                <button data-click="formatText" data-value-one="formatBlock" data-value-two="h2" title="Heading 1">H1</button>
                <button data-click="formatText" data-value-one="formatBlock" data-value-two="h3" title="Heading 2">H2</button>
                <button data-click="formatText" data-value-one="formatBlock" data-value-two="p" title="Paragraph">P</button>
                <span class="border-l border-dark-border mx-1"></span>
                <button data-click="formatText" data-value-one="insertUnorderedList" data-value-two="" title="Bullet List">• List</button>
                <button data-click="formatText" data-value-one="insertOrderedList" data-value-two="" title="Numbered List">1. List</button>
                <span class="border-l border-dark-border mx-1"></span>
                <button data-click="insertLink" title="Insert Link">🔗 Link</button>
                <button data-click="insertImage" title="Insert Image">🖼 Image</button>
            </div>
            <div id="text-editor" contenteditable="true" class="editor-content"></div>
        </div>
    `;
}

function renderQuizEditor() {
    return `
        <div class="bg-dark-surface border border-dark-border rounded-lg p-6">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-semibold">Quiz Questions</h2>
                <button data-click="addQuestion" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold transition-colors">
                    + Add Question
                </button>
            </div>
            
            <label class="block mb-4 text-sm">Quiz title (defaults to the lesson title)
                <input id="quiz-title" maxlength="255" class="mt-1 block w-full rounded-lg border border-dark-border bg-dark-bg p-2">
            </label>
            <div id="quiz-questions" class="space-y-4">
                <!-- Questions will be added here -->
            </div>
            
            <div class="mt-6 p-4 bg-blue-900/20 border border-blue-800/30 rounded-lg">
                <h3 class="font-semibold text-blue-400 mb-2">Quiz Settings</h3>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div>
                        <label for="quiz-passing-score" class="block text-sm mb-2">Passing Score (%)</label>
                        <input type="number" id="quiz-passing-score" min="0" max="100" value="50"
                            class="w-full px-4 py-2 bg-dark-bg border border-dark-border rounded-lg">
                    </div>
                    <div>
                        <label for="quiz-time-limit" class="block text-sm mb-2">Time Limit (minutes, 0 for no limit)</label>
                        <input type="number" id="quiz-time-limit" min="0" value="0" 
                            class="w-full px-4 py-2 bg-dark-bg border border-dark-border rounded-lg">
                    </div>
                    <div>
                        <label for="quiz-attempts" class="block text-sm mb-2">Max Attempts</label>
                        <input type="number" id="quiz-attempts" min="0" value="3" 
                            class="w-full px-4 py-2 bg-dark-bg border border-dark-border rounded-lg">
                        <p class="text-xs text-gray-400 mt-1">0 for unlimited</p>
                    </div>
                    <p class="text-xs text-gray-400">Save Draft hides the quiz. Save &amp; Publish makes it available when the course is published.</p>
                </div>
            </div>
        </div>
    `;
}

// Load content functions
function loadVideoContent() {
    if (lessonData.video_url) {
        document.getElementById('video-url').value = lessonData.video_url;
        updateVideoPreview();
    }
    if (lessonData.content_text) {
        document.getElementById('video-description').value = lessonData.content_text;
    }
    
    // Add event listener for URL changes
    document.getElementById('video-url').addEventListener('input', updateVideoPreview);
}

function updateVideoPreview() {
    const url = document.getElementById('video-url').value;
    const preview = document.getElementById('video-preview');
    const iframe = document.getElementById('video-iframe');
    const file = document.getElementById('video-file');
    let embedUrl;
    let fileUrl;
    try {
        const parsed = new URL(url);
        if (['http:', 'https:'].includes(parsed.protocol)) {
            const host = parsed.hostname.replace(/^(www|m)\./, '');
            const parts = parsed.pathname.split('/');
            if (host === 'youtu.be' || ['youtube.com', 'youtube-nocookie.com', 'music.youtube.com'].includes(host)) {
                const videoId = host === 'youtu.be' ? parts[1] : parsed.searchParams.get('v') || parts[2];
                if (/^[A-Za-z0-9_-]{6,20}$/.test(videoId || '')) embedUrl = `https://www.youtube.com/embed/${videoId}`;
            } else if (['vimeo.com', 'player.vimeo.com'].includes(host)) {
                const videoId = parts.find(part => /^\d+$/.test(part));
                if (videoId) embedUrl = `https://player.vimeo.com/video/${videoId}`;
            } else if (/\.(mp4|webm|ogg|ogv|m4v|mov)$/i.test(parsed.pathname)) {
                fileUrl = parsed.href;
            }
        }
    } catch (error) {
        // Wait for a complete URL.
    }

    iframe.classList.toggle('hidden', !embedUrl);
    if (embedUrl) iframe.src = embedUrl;
    else iframe.removeAttribute('src');

    file.classList.toggle('hidden', !fileUrl);
    if (fileUrl) file.src = fileUrl;
    else if (file.hasAttribute('src')) {
        file.removeAttribute('src');
        file.load();
    }
    preview.classList.toggle('hidden', !embedUrl && !fileUrl);
}

function loadTextContent() {
    if (!lessonData.content_text) return;
    const editor = document.getElementById('text-editor');
    editor.replaceChildren(formattedLessonContent(lessonData.content_text));
}

async function loadQuizContent() {
    try {
        // Try to fetch quiz from the API
        const response = await apiRequest(`/assessments/quiz/lesson/${lessonId}/manage/`);
        
        if (!response) {
            addQuestion();
            return;
        }
        if (response.title) {
            document.getElementById('quiz-title').value = response.title;
        }
        if (response.passing_percentage != null) {
            document.getElementById('quiz-passing-score').value = response.passing_percentage;
        }
        if (response.time_limit_minutes !== undefined) {
            document.getElementById('quiz-time-limit').value = response.time_limit_minutes || 0;
        }
        if (response.max_attempts !== undefined) {
            document.getElementById('quiz-attempts').value = response.max_attempts || 0;
        }
        
        const questions = response.questions || [];
        questions.forEach(q => {
            addQuestion({
                text: q.question_text || '',
                options: (q.options || []).map(opt => ({
                    text: opt.option_text || '',
                    is_correct: !!opt.is_correct
                })),
                explanation: q.explanation || '',
                marks: q.marks,
                difficulty: q.difficulty
            });
        });
        
        if (questions.length === 0) {
            addQuestion();
        }
    } catch (error) {
        if (error.status === 404) addQuestion();
        else showAlert(error.message || 'Could not load quiz.', 'error');
    }
}

// Text editor formatting
function formatText(command, value = null) {
    document.execCommand(command, false, value);
    document.getElementById('text-editor').focus();
}

async function insertEditorUrl(command, title) {
    const editor = document.getElementById('text-editor');
    const selection = window.getSelection();
    const range = selection.rangeCount ? selection.getRangeAt(0).cloneRange() : null;
    const url = await showTextPrompt(title, { type: 'url' });
    if (!url || !/^https?:\/\//i.test(url)) {
        if (url) showAlert('Enter an HTTP or HTTPS URL.', 'error');
        return;
    }
    editor.focus();
    if (range && editor.contains(range.commonAncestorContainer)) {
        selection.removeAllRanges();
        selection.addRange(range);
    }
    formatText(command, url);
}

function insertLink() {
    return insertEditorUrl('createLink', 'Link URL');
}

function insertImage() {
    return insertEditorUrl('insertImage', 'Image URL');
}

// Quiz functions
let questionCount = 0;

function addQuestion(questionData = null) {
    questionCount++;
    const container = document.getElementById('quiz-questions');
    const questionId = questionData?.id || `q${questionCount}`;
    
    const questionHtml = `
        <div class="quiz-question" data-question-id="${escapeHtml(questionId)}" data-difficulty="${escapeHtml(questionData?.difficulty || 'medium')}">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-semibold">Question ${escapeHtml(questionCount)}</h3>
                <button data-click="removeQuestion" data-value-one="${escapeHtml(questionId)}" class="text-red-400 hover:text-red-300">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            
            <div class="mb-4">
                <label class="block text-sm mb-2">Question Text</label>
                <input type="text" class="question-text w-full px-4 py-2 bg-dark-bg border border-dark-border rounded-lg" 
                    value="${escapeHtml(questionData?.text || '')}" placeholder="Enter your question...">
            </div>
            
            <label class="block mb-4 text-sm">Marks
                <input type="number" min="1" class="question-marks ml-2 w-24 rounded-lg border border-dark-border bg-dark-bg p-2" value="${escapeHtml(questionData?.marks ?? 1)}">
            </label>
            <div class="mb-4">
                <label class="block text-sm mb-2">Options</label>
                <div class="space-y-2 question-options">
                    ${renderQuestionOptions(questionData?.options || []) /* escapes its own data */}
                </div>
                <button data-click="addOption" data-value-one="${escapeHtml(questionId)}" class="mt-2 text-sm text-blue-400 hover:text-blue-300">
                    + Add Option
                </button>
            </div>
            
            <div>
                <label class="block text-sm mb-2">Explanation (optional)</label>
                <textarea class="question-explanation w-full px-4 py-2 bg-dark-bg border border-dark-border rounded-lg" 
                    rows="2" placeholder="Explain the correct answer...">${escapeHtml(questionData?.explanation || '')}</textarea>
            </div>
        </div>
    `;
    
    container.insertAdjacentHTML('beforeend', questionHtml);
    
    if (!questionData || !questionData.options || questionData.options.length === 0) {
        // Add default options
        addOption(questionId);
        addOption(questionId);
        addOption(questionId);
        addOption(questionId);
    }
}

function renderQuestionOptions(options) {
    return options.map((opt, index) => `
        <div class="quiz-option ${escapeHtml(opt.is_correct ? 'correct' : '')}" data-option-index="${escapeHtml(index)}">
            <input type="radio" name="correct-${escapeHtml(Date.now())}" ${escapeHtml(opt.is_correct ? 'checked' : '')} 
                data-change="markCorrect" class="w-4 h-4 text-green-600">
            <input type="text" maxlength="255" class="option-text flex-1 px-3 py-2 bg-transparent border-0 focus:outline-none"
                value="${escapeHtml(opt.text || '')}" placeholder="Option ${escapeHtml(String.fromCharCode(65 + index))}">
            <button data-click="removeOption" class="text-red-400 hover:text-red-300">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
    `).join('');
}

function addOption(questionId) {
    const question = document.querySelector(`[data-question-id="${questionId}"]`);
    const optionsContainer = question.querySelector('.question-options');
    const optionCount = optionsContainer.children.length;
    const radioName = `correct-${questionId}`;
    
    const optionHtml = `
        <div class="quiz-option" data-option-index="${escapeHtml(optionCount)}">
            <input type="radio" name="${escapeHtml(radioName)}" data-change="markCorrect" class="w-4 h-4 text-green-600">
            <input type="text" maxlength="255" class="option-text flex-1 px-3 py-2 bg-transparent border-0 focus:outline-none"
                placeholder="Option ${escapeHtml(String.fromCharCode(65 + optionCount))}">
            <button data-click="removeOption" class="text-red-400 hover:text-red-300">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
    `;
    
    optionsContainer.insertAdjacentHTML('beforeend', optionHtml);
}

function removeOption(button) {
    const option = button.closest('.quiz-option');
    option.remove();
}

function markCorrect(radio) {
    const question = radio.closest('.quiz-question');
    question.querySelectorAll('.quiz-option').forEach(opt => opt.classList.remove('correct'));
    radio.closest('.quiz-option').classList.add('correct');
}

async function removeQuestion(questionId) {
    const question = document.querySelector(`[data-question-id="${questionId}"]`);
    if (await showConfirm('Remove this question?')) {
        question.remove();
    }
}

// Save functions
async function saveDraft() {
    await saveContent(true);
}

async function saveContent(isDraft = false) {
    try {
        const contentType = document.getElementById('lesson-type').value;
        
        // Basic lesson data
        const lessonUpdateData = {
            title: document.getElementById('lesson-title').value,
            content_type: contentType,
            duration_seconds: (parseInt(document.getElementById('lesson-duration').value) || 0) * 60,
            is_free: document.getElementById('lesson-is-free').checked
        };
        
        // Content based on type
        switch(contentType) {
            case 'video':
                lessonUpdateData.video_url = document.getElementById('video-url').value;
                lessonUpdateData.content_text = document.getElementById('video-description').value;
                break;
                
            case 'text':
                lessonUpdateData.content_text = document.getElementById('text-editor').innerHTML;
                break;
                
            case 'quiz':
                lessonUpdateData.content_text = 'Quiz';
                break;
        }

        if (contentType === 'quiz') {
            await apiRequest(`/assessments/quiz/lesson/${lessonId}/manage/`, {
                method: 'POST',
                body: JSON.stringify({...collectQuizData(), lesson: lessonUpdateData, is_published: !isDraft}),
            });
        } else {
            await apiRequest(`/courses/lessons/${lessonId}/`, {
                method: 'PUT',
                body: JSON.stringify(lessonUpdateData),
            });
        }

        showAlert(isDraft ? 'Draft saved successfully!' : 'Content saved successfully!', 'success');
        
        if (!isDraft) {
            setTimeout(() => history.back(), 1500);
        }
        
    } catch (error) {
        console.error('Error saving content:', error);
        showAlert(error.message || 'Failed to save content', 'error');
    }
}

function collectQuizData() {
    const questions = [];
    document.querySelectorAll('.quiz-question').forEach(q => {
        const options = [];
        q.querySelectorAll('.quiz-option').forEach(opt => {
            const optionText = opt.querySelector('.option-text').value.trim();
            if (optionText) {  // Only add non-empty options
                options.push({
                    text: optionText,
                    is_correct: opt.querySelector('input[type="radio"]').checked
                });
            }
        });
        
        const questionText = q.querySelector('.question-text').value.trim();
        if (questionText || options.length || q.querySelector('.question-explanation').value.trim()) {
            questions.push({
                text: questionText,
                type: 'mcq',  // Multiple choice question
                marks: q.querySelector('.question-marks').value,
                difficulty: q.dataset.difficulty,
                options: options,
                explanation: q.querySelector('.question-explanation').value.trim()
            });
        }
    });
    
    return {
        title: document.getElementById('quiz-title').value.trim() || document.getElementById('lesson-title').value,
        passing_percentage: document.getElementById('quiz-passing-score').value,
        time_limit_minutes: parseInt(document.getElementById('quiz-time-limit').value) || 0,
        max_attempts: parseInt(document.getElementById('quiz-attempts').value) || 0,
        questions: questions
    };
}


bindActions({
    click: {
        goBack: (event) => { event.preventDefault(); history.back(); },
        saveDraft: () => saveDraft(),
        saveContent: () => saveContent(),
        formatText: (event, control) => formatText(control.dataset.valueOne, control.dataset.valueTwo || undefined),
        insertLink: () => insertLink(),
        insertImage: () => insertImage(),
        addQuestion: () => addQuestion(),
        removeQuestion: (event, control) => removeQuestion(control.dataset.valueOne),
        addOption: (event, control) => addOption(control.dataset.valueOne),
        removeOption: (event, control) => removeOption(control),
    },
    change: {
        switchContentType: () => switchContentType(),
        markCorrect: (event, control) => markCorrect(control),
    },
});
</script>
{% endblock %}
