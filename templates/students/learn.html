{% extends 'base.html' %}

{% block title %}Learn - SkillStudio{% endblock %}

{% block content %}
<div id="learning-container">
    <!-- Loading State -->
    <div class="flex justify-center items-center h-screen">
        <div class="animate-spin h-16 w-16 border-4 border-blue-500 border-t-transparent rounded-full"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
/*
 * Learn page.
 *  - Sidebar: GET /api/courses/<id>/curriculum/ (is_completed / is_locked per lesson,
 *    same progression rule the server enforces).
 *  - Lesson content: GET /api/courses/lessons/<id>/content/ (LRN-01).
 *  - Video lessons report real playing time to
 *    PATCH /api/enrollments/lessons/<id>/watch-time/ and complete automatically
 *    at 80% watched (LRN-02).
 * Page access itself is gated server-side (@cookie_login_required).
 */
let courseSlug;
let courseId;
let enrollmentData;
let currentLesson = null;      // curriculum summary of the open lesson
let currentLessonData = null;  // full content of the open lesson
let sections = [];             // curriculum modules
let watchTracker = null;

const WATCH_FLUSH_MS = 30000;      // report watch time every 30s while playing
const MAX_WATCH_DELTA = 120;       // server accepts at most 120s per report

document.addEventListener('DOMContentLoaded', function() {
    courseSlug = window.location.pathname.split('/')[2];
    loadCourse();
});

window.addEventListener('pagehide', () => {
    if (watchTracker) watchTracker.flush(true);
});

// ------------------------------------------------------------------
// Data loading
// ------------------------------------------------------------------

async function fetchOwnedEnrollment() {
    const response = await apiRequest(`/enrollments/?course_slug=${encodeURIComponent(courseSlug)}`);
    const enrollments = response?.results || [];
    // Completed courses stay accessible (LRN-03); canceled ones don't.
    return enrollments.find(e => e.status === 'active' || e.status === 'completed') || null;
}

async function loadCurriculum() {
    const curriculum = await apiRequest(`/courses/${courseId}/curriculum/`);
    sections = curriculum.modules || [];
}

async function loadCourse() {
    try {
        enrollmentData = await fetchOwnedEnrollment();
        if (!enrollmentData) {
            window.location.href = `/courses/${encodeURIComponent(courseSlug)}/`;
            return;
        }
        courseId = enrollmentData.course.id;
        await loadCurriculum();

        currentLesson = findNextLesson();
        renderLearningInterface();
        if (currentLesson) {
            loadLesson(currentLesson.id);
        }
    } catch (error) {
        console.error('Error loading course:', error);
        document.getElementById('learning-container').innerHTML = `
            <div class="flex items-center justify-center h-screen">
                <div class="text-center">
                    <svg class="w-20 h-20 mx-auto mb-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                    </svg>
                    <p class="text-xl font-semibold mb-2">Error Loading Course</p>
                    <p class="text-gray-400 mb-6">${escapeHtml(error.message || 'Failed to load course content')}</p>
                    <a href="/my-courses/" class="inline-block px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg">
                        Back to My Courses
                    </a>
                </div>
            </div>
        `;
    }
}

/** Re-read progress from the server after a lesson is completed. */
async function refreshProgress() {
    try {
        const fresh = await fetchOwnedEnrollment();
        if (fresh) enrollmentData = fresh;
        await loadCurriculum();
        const summary = findLessonSummary(currentLesson && currentLesson.id);
        if (summary) currentLesson = summary;
        renderSidebar();
        updateNavigationButtons();
    } catch (error) {
        console.error('Error refreshing progress:', error);
    }
}

function allLessons() {
    const lessons = [];
    sections.forEach(section => (section.lessons || []).forEach(lesson => lessons.push(lesson)));
    return lessons;
}

function findLessonSummary(lessonId) {
    return allLessons().find(l => l.id === lessonId) || null;
}

function findNextLesson() {
    const lessons = allLessons();
    return lessons.find(l => !l.is_completed && !l.is_locked) || lessons[0] || null;
}

function formatDuration(seconds) {
    if (!seconds) return '';
    const minutes = Math.max(1, Math.round(seconds / 60));
    return `${minutes} min`;
}

// ------------------------------------------------------------------
// Layout
// ------------------------------------------------------------------

function renderLearningInterface() {
    const container = document.getElementById('learning-container');
    container.innerHTML = `
        <div class="flex h-screen overflow-hidden">
            <!-- Sidebar - Course Content -->
            <div id="course-sidebar" class="w-96 bg-dark-surface border-r border-dark-border overflow-y-auto"></div>

            <!-- Main Content Area -->
            <div class="flex-1 flex flex-col overflow-hidden">
                <div class="bg-dark-surface border-b border-dark-border p-6">
                    <h1 id="lesson-title" class="text-2xl font-bold mb-2">Select a lesson to start</h1>
                    <p id="lesson-type" class="text-gray-400"></p>
                </div>

                <div id="lesson-content" class="flex-1 overflow-y-auto p-8 bg-dark-bg">
                    <div class="max-w-4xl mx-auto text-center text-gray-400">
                        <p>Select a lesson from the sidebar to begin learning</p>
                    </div>
                </div>

                <div id="lesson-navigation" class="hidden bg-dark-surface border-t border-dark-border p-6">
                    <div class="flex items-center justify-between max-w-4xl mx-auto">
                        <button id="prev-lesson" onclick="navigateLesson('prev')" class="px-6 py-3 bg-dark-hover hover:bg-dark-border border border-dark-border text-white rounded-lg font-semibold transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                            ← Previous Lesson
                        </button>
                        <button id="mark-complete" onclick="markLessonComplete()" class="px-6 py-3 bg-green-600 hover:bg-green-700 text-white rounded-lg font-semibold transition-colors disabled:cursor-not-allowed">
                            Mark as Complete
                        </button>
                        <button id="next-lesson" onclick="navigateLesson('next')" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                            Next Lesson →
                        </button>
                    </div>
                </div>
            </div>
        </div>
    `;
    renderSidebar();
}

function renderSidebar() {
    const sidebar = document.getElementById('course-sidebar');
    if (!sidebar) return;
    const course = enrollmentData.course;
    const progress = Math.round(enrollmentData.progress_percentage || 0);

    // Note: renderSection/renderLesson escape every API value themselves; the
    // HTML they return is trusted and must NOT be passed through escapeHtml.
    sidebar.innerHTML = `
        <div class="p-6 border-b border-dark-border">
            <a href="/my-courses/" class="text-sm text-gray-400 hover:text-white mb-3 inline-block">← Back to My Courses</a>
            <h2 class="text-xl font-semibold mb-2">${escapeHtml(course.title)}</h2>
            <div class="flex items-center justify-between text-sm text-gray-400 mb-3">
                <span>${escapeHtml(enrollmentData.completed_lessons_count || 0)} / ${escapeHtml(enrollmentData.total_lessons_count || 0)} lessons</span>
                <span>${escapeHtml(progress)}% complete</span>
            </div>
            <div class="w-full bg-dark-bg rounded-full h-2">
                <div class="bg-blue-600 h-2 rounded-full transition-all" style="width: ${escapeHtml(progress)}%"></div>
            </div>
            ${enrollmentData.status === 'completed' ? `
                <p class="mt-3 text-sm text-green-400">✓ Course completed — you can keep reviewing it any time.</p>
            ` : ''}
        </div>
        <div class="p-4">
            ${sections.map((section, index) => renderSection(section, index)).join('')}
        </div>
    `;
    updateSidebarHighlight();
}

function renderSection(section, sectionIndex) {
    const lessons = section.lessons || [];
    return `
        <div class="mb-4">
            <button onclick="toggleSection(${Number(sectionIndex)})" class="w-full text-left p-3 bg-dark-hover rounded-lg hover:bg-dark-border transition-colors flex items-center justify-between">
                <span class="font-semibold">Section ${Number(sectionIndex) + 1}: ${escapeHtml(section.title)}</span>
                <svg class="section-chevron w-5 h-5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                </svg>
            </button>
            <div class="section-content space-y-1 mt-2">
                ${lessons.map(lesson => renderLesson(lesson)).join('')}
            </div>
        </div>
    `;
}

const TYPE_ICONS = {
    video: 'M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z M21 12a9 9 0 11-18 0 9 9 0 0118 0z',
    text: 'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z',
    quiz: 'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2',
    locked: 'M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z',
};

function renderLesson(lesson) {
    const id = Number(lesson.id);
    const meta = [lesson.content_type, formatDuration(lesson.duration_seconds), lesson.is_free ? 'free preview' : '']
        .filter(Boolean).join(' • ');
    let icon;
    if (lesson.is_completed) {
        icon = `<svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>`;
    } else {
        const path = lesson.is_locked ? TYPE_ICONS.locked : (TYPE_ICONS[lesson.content_type] || TYPE_ICONS.text);
        icon = `<svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${path}"/></svg>`;
    }
    return `
        <button data-lesson-id="${id}" onclick="loadLesson(${id})" ${lesson.is_locked ? 'disabled title="Complete the previous lessons to unlock"' : ''}
                class="lesson-item w-full text-left p-3 rounded-lg transition-colors flex items-center space-x-3 hover:bg-dark-hover disabled:opacity-50 disabled:cursor-not-allowed">
            <div class="w-8 h-8 flex-shrink-0 ${lesson.is_completed ? 'bg-green-900/50' : 'bg-dark-bg'} rounded-lg flex items-center justify-center">${icon}</div>
            <div class="flex-1 min-w-0">
                <p class="font-medium text-sm truncate ${lesson.is_completed ? 'text-green-400' : ''}">${escapeHtml(lesson.title)}</p>
                <p class="text-xs text-gray-500 capitalize">${escapeHtml(meta)}</p>
            </div>
        </button>
    `;
}

function toggleSection(index) {
    const contents = document.querySelectorAll('.section-content');
    const chevrons = document.querySelectorAll('.section-chevron');
    if (contents[index]) contents[index].classList.toggle('hidden');
    if (chevrons[index]) chevrons[index].classList.toggle('rotate-180');
}

function updateSidebarHighlight() {
    document.querySelectorAll('#course-sidebar .lesson-item').forEach(btn => {
        const isCurrent = currentLesson && Number(btn.dataset.lessonId) === currentLesson.id;
        btn.classList.toggle('bg-blue-900/30', isCurrent);
        btn.classList.toggle('border-l-4', isCurrent);
        btn.classList.toggle('border-blue-500', isCurrent);
    });
}

// ------------------------------------------------------------------
// Lesson loading
// ------------------------------------------------------------------

function renderMessage(title, message, tone = 'gray') {
    const colors = { gray: 'text-gray-600', yellow: 'text-yellow-500', red: 'text-red-500' };
    document.getElementById('lesson-content').innerHTML = `
        <div class="max-w-4xl mx-auto text-center py-12">
            <svg class="w-20 h-20 mx-auto mb-4 ${colors[tone] || colors.gray}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${TYPE_ICONS.locked}"/>
            </svg>
            <p class="text-xl font-semibold mb-2">${escapeHtml(title)}</p>
            <p class="text-gray-400">${escapeHtml(message)}</p>
        </div>
    `;
}

async function loadLesson(lessonId) {
    const summary = findLessonSummary(lessonId);
    if (!summary) return;

    stopWatchTracking();
    currentLesson = summary;
    currentLessonData = null;
    document.getElementById('lesson-title').textContent = summary.title;
    const typeLabel = summary.content_type.charAt(0).toUpperCase() + summary.content_type.slice(1);
    const duration = formatDuration(summary.duration_seconds);
    document.getElementById('lesson-type').textContent = duration ? `${typeLabel} • ${duration}` : typeLabel;
    document.getElementById('lesson-navigation').classList.remove('hidden');
    updateSidebarHighlight();
    updateNavigationButtons();

    if (summary.is_locked) {
        renderMessage('Lesson locked', 'Complete the previous lessons to unlock this one.', 'yellow');
        return;
    }

    const contentArea = document.getElementById('lesson-content');
    contentArea.innerHTML = `
        <div class="flex justify-center py-16">
            <div class="animate-spin h-10 w-10 border-4 border-blue-500 border-t-transparent rounded-full"></div>
        </div>`;

    try {
        currentLessonData = await apiRequest(`/courses/lessons/${Number(lessonId)}/content/`);
    } catch (error) {
        const code = error.body && error.body.code;
        if (code === 'lesson_locked') {
            renderMessage('Lesson locked', 'Complete the previous lessons to unlock this one.', 'yellow');
        } else {
            renderMessage('Could not load this lesson', error.message || 'Please try again.', 'red');
        }
        return;
    }
    if (!currentLesson || currentLesson.id !== lessonId) return;  // user moved on meanwhile

    const data = currentLessonData;
    if (data.content_type === 'video') {
        renderVideoLesson(data);
    } else if (data.content_type === 'quiz') {
        loadQuizInterface();
    } else {
        const resources = renderResources(data);
        contentArea.innerHTML = `
            <div class="max-w-4xl mx-auto prose prose-invert prose-lg">
                ${data.content_text ? `<div class="text-gray-300 whitespace-pre-wrap mb-6">${escapeHtml(data.content_text)}</div>` : ''}
                ${resources}
                ${!data.content_text && !resources ? '<p class="text-gray-400 text-center">This lesson has no content yet.</p>' : ''}
            </div>
        `;
    }
    updateNavigationButtons();
}

function renderResources(data) {
    const resources = data.resources || [];
    if (!resources.length) return '';
    return `
        <div class="mt-8 not-prose">
            <h3 class="text-lg font-semibold mb-3">Resources</h3>
            <ul class="space-y-2">
                ${resources.map(r => `
                    <li><a href="${safeUrl(r.file_url)}" target="_blank" rel="noopener noreferrer"
                           class="text-blue-400 hover:underline">${escapeHtml(r.resource_type || 'Resource')}</a></li>
                `).join('')}
            </ul>
        </div>
    `;
}

function updateNavigationButtons() {
    if (!currentLesson) return;
    const lessons = allLessons();
    const index = lessons.findIndex(l => l.id === currentLesson.id);
    document.getElementById('prev-lesson').disabled = index <= 0;
    const next = lessons[index + 1];
    document.getElementById('next-lesson').disabled = !next || next.is_locked;

    const markBtn = document.getElementById('mark-complete');
    const data = currentLessonData;
    const tracked = data && data.content_type === 'video' && data.video && data.duration_seconds > 0;
    markBtn.classList.remove('bg-gray-700', 'bg-green-600', 'hover:bg-green-700');
    if (currentLesson.is_completed) {
        markBtn.textContent = '✓ Completed';
        markBtn.classList.add('bg-gray-700');
        markBtn.disabled = true;
    } else if (currentLesson.is_locked) {
        markBtn.textContent = 'Locked';
        markBtn.classList.add('bg-gray-700');
        markBtn.disabled = true;
    } else if (tracked) {
        // Video lessons complete automatically once 80% has been watched.
        markBtn.textContent = 'Completes at 80% watched';
        markBtn.classList.add('bg-gray-700');
        markBtn.disabled = true;
    } else {
        markBtn.textContent = 'Mark as Complete';
        markBtn.classList.add('bg-green-600', 'hover:bg-green-700');
        markBtn.disabled = false;
    }
}

function navigateLesson(direction) {
    const lessons = allLessons();
    const index = lessons.findIndex(l => l.id === currentLesson.id);
    const target = lessons[direction === 'next' ? index + 1 : index - 1];
    if (target && !target.is_locked) loadLesson(target.id);
}

async function markLessonComplete() {
    if (!currentLesson) return;
    const lessonId = currentLesson.id;
    try {
        await apiRequest(`/enrollments/lessons/${Number(lessonId)}/complete/?timezone=${learningTimezone}`, { method: 'POST' });
        showAlert('Lesson marked as complete!', 'success');
        await onLessonCompleted(lessonId, true);
    } catch (error) {
        console.error('Error marking lesson complete:', error);
        showAlert(error.message || 'Failed to mark lesson as complete', 'error');
    }
}

async function onLessonCompleted(lessonId, advance) {
    await refreshProgress();
    if (!advance || !currentLesson || currentLesson.id !== lessonId) return;
    const lessons = allLessons();
    const next = lessons[lessons.findIndex(l => l.id === lessonId) + 1];
    if (next && !next.is_locked) setTimeout(() => loadLesson(next.id), 800);
}

// ------------------------------------------------------------------
// Video playback + watch-time tracking (LRN-02)
// ------------------------------------------------------------------

function renderVideoLesson(data) {
    const contentArea = document.getElementById('lesson-content');
    contentArea.innerHTML = `
        <div class="max-w-4xl mx-auto">
            <div id="video-host" class="aspect-video bg-black rounded-lg mb-4 flex items-center justify-center overflow-hidden"></div>
            <div id="watch-progress" class="mb-6 ${data.video && data.duration_seconds > 0 ? '' : 'hidden'}">
                <div class="flex justify-between text-sm text-gray-400 mb-1">
                    <span>Watched</span><span id="watch-progress-label">0%</span>
                </div>
                <div class="w-full bg-dark-surface rounded-full h-2">
                    <div id="watch-progress-bar" class="bg-green-600 h-2 rounded-full transition-all" style="width: 0%"></div>
                </div>
                <p class="text-xs text-gray-500 mt-1">This lesson completes automatically once you've watched 80% of it.</p>
            </div>
            ${data.content_text ? `
                <div class="prose prose-invert max-w-none">
                    <h3>Description</h3>
                    <p class="text-gray-300 whitespace-pre-wrap">${escapeHtml(data.content_text)}</p>
                </div>
            ` : ''}
            ${renderResources(data)}
        </div>
    `;

    const host = document.getElementById('video-host');
    const video = data.video;
    if (!video) {
        host.innerHTML = `
            <div class="text-center text-white p-6">
                <p class="text-gray-300">This video can't be played here.</p>
                ${data.video_url ? `<a href="${safeUrl(data.video_url)}" target="_blank" rel="noopener noreferrer" class="text-blue-400 hover:underline text-sm">Open the video in a new tab</a>` : '<p class="text-sm text-gray-500 mt-2">No video has been added to this lesson yet.</p>'}
            </div>`;
        return;
    }

    const tracking = data.duration_seconds > 0 && !currentLesson.is_completed;
    const tracker = tracking ? new WatchTracker(data.id, onWatchProgress) : null;
    watchTracker = tracker;
    const onPlaying = playing => { if (tracker) tracker.setPlaying(playing); };

    if (video.provider === 'youtube') mountYouTube(host, video.id, onPlaying, tracker);
    else if (video.provider === 'vimeo') mountVimeo(host, video.id, onPlaying, tracker);
    else if (video.provider === 'file') mountFile(host, video.url, onPlaying);

    if (data.duration_seconds > 0) {
        apiRequest(`/enrollments/lessons/${Number(data.id)}/progress/`)
            .then(progress => setWatchProgress(progress.progress_percentage || 0))
            .catch(() => {});
    }
}

function setWatchProgress(percentage) {
    const pct = Math.max(0, Math.min(100, Math.round(Number(percentage) || 0)));
    const bar = document.getElementById('watch-progress-bar');
    const label = document.getElementById('watch-progress-label');
    if (bar) bar.style.width = `${pct}%`;
    if (label) label.textContent = `${pct}%`;
}

function onWatchProgress(result, lessonId) {
    if (currentLesson && currentLesson.id === lessonId) setWatchProgress(result.progress_percentage);
    if (result.completed) {
        if (watchTracker && watchTracker.lessonId === lessonId) stopWatchTracking();
        showAlert('Lesson completed!', 'success');
        onLessonCompleted(lessonId, false);
    }
}

function stopWatchTracking() {
    if (watchTracker) {
        watchTracker.stop();
        watchTracker = null;
    }
}

/**
 * Counts seconds the video is actually playing while the page is visible
 * (seeking ahead does not count) and reports them as bounded deltas.
 */
class WatchTracker {
    constructor(lessonId, onProgress) {
        this.lessonId = lessonId;
        this.onProgress = onProgress;
        this.playing = false;
        this.pending = 0;
        this.inflight = false;
        this.stopped = false;
        this.last = performance.now();
        this.tickTimer = setInterval(() => this.tick(), 1000);
        this.flushTimer = setInterval(() => this.flush(), WATCH_FLUSH_MS);
        this.onVisibility = () => {
            this.tick();
            if (document.visibilityState === 'hidden') this.flush(true);
        };
        document.addEventListener('visibilitychange', this.onVisibility);
    }

    tick() {
        const now = performance.now();
        if (this.playing && document.visibilityState === 'visible') {
            this.pending += Math.min((now - this.last) / 1000, 2);  // ignore long timer stalls
        }
        this.last = now;
        this.pending = Math.min(this.pending, MAX_WATCH_DELTA);
    }

    setPlaying(playing) {
        if (this.stopped) return;
        this.tick();
        this.playing = playing;
        if (!playing) this.flush();
    }

    async flush(keepalive = false) {
        this.tick();
        const delta = Math.floor(this.pending);
        if (delta < 1 || this.inflight) return;
        this.inflight = true;
        this.pending -= delta;
        try {
            const result = await sendWatchDelta(this.lessonId, delta, keepalive);
            if (result && this.onProgress) this.onProgress(result, this.lessonId);
        } catch (error) {
            // 400 = the server judged the delta implausible: drop it. Otherwise retry later.
            if (error.status !== 400) this.pending = Math.min(this.pending + delta, MAX_WATCH_DELTA);
        } finally {
            this.inflight = false;
        }
    }

    stop() {
        if (this.stopped) return;
        this.flush(true);
        this.stopped = true;
        this.playing = false;
        clearInterval(this.tickTimer);
        clearInterval(this.flushTimer);
        document.removeEventListener('visibilitychange', this.onVisibility);
    }
}

const learningTimezone = encodeURIComponent(Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC');

async function sendWatchDelta(lessonId, delta, keepalive) {
    const url = `/enrollments/lessons/${Number(lessonId)}/watch-time/?timezone=${learningTimezone}`;
    const body = JSON.stringify({ watch_time_delta: Math.min(delta, MAX_WATCH_DELTA) });
    if (!keepalive) {
        return apiRequest(url, { method: 'PATCH', body });
    }
    // keepalive lets the request finish while the page is being hidden/closed.
    const response = await fetch(`${API_BASE}${url}`, {
        method: 'PATCH',
        body,
        keepalive: true,
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') || '' },
    });
    if (!response.ok) {
        const error = new Error(`HTTP ${response.status}`);
        error.status = response.status;
        throw error;
    }
    return response.json();
}

const scriptPromises = {};
function loadScriptOnce(src) {
    if (!scriptPromises[src]) {
        scriptPromises[src] = new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = src;
            script.async = true;
            script.onload = resolve;
            script.onerror = () => reject(new Error(`Failed to load ${src}`));
            document.head.appendChild(script);
        });
    }
    return scriptPromises[src];
}

let youTubeApiPromise = null;
function loadYouTubeApi() {
    if (window.YT && window.YT.Player) return Promise.resolve(window.YT);
    if (!youTubeApiPromise) {
        youTubeApiPromise = new Promise((resolve, reject) => {
            const previous = window.onYouTubeIframeAPIReady;
            window.onYouTubeIframeAPIReady = () => {
                if (typeof previous === 'function') previous();
                resolve(window.YT);
            };
            loadScriptOnce('https://www.youtube.com/iframe_api').catch(reject);
        });
    }
    return youTubeApiPromise;
}

function playerError(host, message) {
    host.innerHTML = `<p class="text-gray-300 p-6 text-center">${escapeHtml(message)}</p>`;
}

async function mountYouTube(host, videoId, onPlaying, tracker) {
    host.innerHTML = '<div id="yt-player" class="w-full h-full"></div>';
    try {
        const YT = await loadYouTubeApi();
        if (tracker !== watchTracker) return;  // lesson changed while loading
        new YT.Player('yt-player', {
            videoId: videoId,
            width: '100%',
            height: '100%',
            playerVars: { rel: 0, modestbranding: 1, origin: window.location.origin },
            events: {
                onStateChange: event => onPlaying(event.data === YT.PlayerState.PLAYING),
                onError: () => playerError(host, 'This YouTube video could not be played.'),
            },
        });
    } catch (error) {
        playerError(host, 'The YouTube player could not be loaded.');
    }
}

async function mountVimeo(host, videoId, onPlaying, tracker) {
    host.innerHTML = '<div id="vimeo-player" class="w-full h-full"></div>';
    try {
        await loadScriptOnce('https://player.vimeo.com/api/player.js');
        if (tracker !== watchTracker) return;
        const player = new window.Vimeo.Player('vimeo-player', { id: Number(videoId), responsive: true });
        player.on('play', () => onPlaying(true));
        player.on('pause', () => onPlaying(false));
        player.on('ended', () => onPlaying(false));
    } catch (error) {
        playerError(host, 'The Vimeo player could not be loaded.');
    }
}

function mountFile(host, url, onPlaying) {
    host.innerHTML = `<video id="lesson-video" class="w-full h-full rounded-lg" controls preload="metadata" src="${safeUrl(url)}"></video>`;
    const video = document.getElementById('lesson-video');
    ['play', 'playing'].forEach(evt => video.addEventListener(evt, () => onPlaying(true)));
    ['pause', 'ended', 'waiting', 'stalled', 'error'].forEach(evt => video.addEventListener(evt, () => onPlaying(false)));
}

// ======================================================
// QUIZ FUNCTIONALITY
// ======================================================

let quizData = null;
let quizAttempt = null;
let quizAnswers = {};
let quizTimerInterval = null;

async function loadQuizInterface() {
    const contentArea = document.getElementById('lesson-content');
    try {
        quizData = await apiRequest(`/assessments/quiz/lesson/${Number(currentLesson.id)}/`);
        if (!quizData.questions || quizData.questions.length === 0) {
            renderMessage('No Questions Available', "This quiz doesn't have any questions yet.");
            return;
        }
        renderQuizStartScreen();
    } catch (error) {
        console.error('Error loading quiz:', error);
        const isNotFound = error.status === 404;
        contentArea.innerHTML = `
            <div class="max-w-4xl mx-auto text-center py-12">
                <p class="text-xl font-semibold mb-2">${escapeHtml(isNotFound ? 'Quiz Not Available Yet' : 'Error Loading Quiz')}</p>
                <p class="text-gray-400 mb-4">${escapeHtml(isNotFound ? "This lesson's quiz hasn't been published yet." : (error.message || 'An error occurred while loading the quiz'))}</p>
            </div>
        `;
    }
}

function attemptStatus() {
    return (quizData && quizData.attempt_status) || {};
}

function attemptsLabel(status) {
    if (status.max_attempts === null || status.max_attempts === undefined) {
        return `${Number(status.attempts_used || 0)} used • unlimited attempts`;
    }
    return `${Number(status.attempts_used || 0)} of ${Number(status.max_attempts)} used`;
}

function renderQuizStartScreen() {
    const contentArea = document.getElementById('lesson-content');
    const questionCount = quizData.questions.length;
    const totalMarks = quizData.total_marks || quizData.questions.reduce((sum, q) => sum + (q.marks || 1), 0);
    const instructions = currentLessonData && currentLessonData.content_text;
    const status = attemptStatus();
    const last = status.last_attempt;

    let action;
    if (status.has_passed) {
        action = `
            <div class="bg-green-900/30 border border-green-500 rounded-lg p-4 text-center">
                <p class="text-green-400 font-semibold">✓ You passed this quiz</p>
                ${currentLesson.is_completed ? '' : `
                    <button onclick="markLessonComplete()" class="mt-3 bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-lg font-semibold">
                        Complete this lesson
                    </button>`}
            </div>`;
    } else if (!status.can_start && !status.has_open_attempt) {
        action = `
            <div class="bg-red-900/30 border border-red-500 rounded-lg p-4 text-center">
                <p class="text-red-400 font-semibold">No attempts left</p>
                <p class="text-sm text-gray-400 mt-1">Contact your instructor if you need another attempt.</p>
            </div>`;
    } else {
        action = `
            <button onclick="startQuiz()" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-6 py-4 rounded-lg font-semibold text-lg transition-colors">
                ${status.has_open_attempt ? 'Resume Quiz' : (status.attempts_used ? 'Try Again' : 'Start Quiz')}
            </button>`;
    }

    contentArea.innerHTML = `
        <div class="max-w-4xl mx-auto">
            <div class="bg-dark-surface rounded-lg p-8 border border-dark-border">
                <h3 class="text-xl font-semibold mb-1">${escapeHtml(quizData.title || currentLesson.title)}</h3>
                <p class="text-sm text-gray-400 mb-6">Pass mark: ${escapeHtml(quizData.passing_percentage ?? 50)}% • Attempts: ${escapeHtml(attemptsLabel(status))}</p>
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="bg-dark-bg p-4 rounded-lg">
                        <p class="text-sm text-gray-400 mb-1">Questions</p>
                        <p class="text-2xl font-bold">${escapeHtml(questionCount)}</p>
                    </div>
                    <div class="bg-dark-bg p-4 rounded-lg">
                        <p class="text-sm text-gray-400 mb-1">Total Marks</p>
                        <p class="text-2xl font-bold">${escapeHtml(totalMarks)}</p>
                    </div>
                    ${quizData.time_limit_minutes ? `
                        <div class="bg-dark-bg p-4 rounded-lg col-span-2">
                            <p class="text-sm text-gray-400 mb-1">Time Limit</p>
                            <p class="text-2xl font-bold">${escapeHtml(quizData.time_limit_minutes)} minutes</p>
                            <p class="text-xs text-gray-500 mt-1">Answers are saved as you go. When time runs out, only saved answers are graded.</p>
                        </div>
                    ` : ''}
                </div>
                ${last ? `
                    <p class="text-sm text-gray-400 mb-4">Last attempt (#${Number(last.attempt_number)}): ${escapeHtml(last.score ?? 0)} marks — ${last.passed ? 'passed' : 'not passed'}${last.is_auto_submitted ? ' (time ran out)' : ''}</p>
                ` : ''}
                ${instructions ? `
                    <div class="prose prose-invert mb-6">
                        <h4>Instructions</h4>
                        <p class="text-gray-300 whitespace-pre-wrap">${escapeHtml(instructions)}</p>
                    </div>
                ` : ''}
                ${action}
            </div>
        </div>
    `;
}

async function startQuiz() {
    try {
        quizAttempt = await apiRequest(`/assessments/quiz/${Number(quizData.id)}/start/`, { method: 'POST' });
        quizAnswers = {};
        renderQuizQuestions();
    } catch (error) {
        console.error('Error starting quiz:', error);
        showAlert(error.message || 'Failed to start quiz', 'error');
        loadQuizInterface();  // refresh attempt status (e.g. already passed / no attempts left)
    }
}

function renderQuizQuestions() {
    const contentArea = document.getElementById('lesson-content');
    // renderQuestion escapes API values itself; its HTML must not be escaped again.
    contentArea.innerHTML = `
        <div class="max-w-4xl mx-auto">
            <div class="bg-dark-surface rounded-lg p-6 border border-dark-border mb-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-xl font-semibold">${escapeHtml(quizData.title || 'Quiz')} — attempt ${Number(quizAttempt.attempt_number || 1)}</h3>
                    ${quizData.time_limit_minutes ? `
                        <div id="quiz-timer" class="bg-blue-900/30 border border-blue-500 px-4 py-2 rounded-lg">
                            <span class="text-blue-400 font-mono font-bold">--:--</span>
                        </div>
                    ` : ''}
                </div>
            </div>
            <div class="space-y-6">
                ${quizData.questions.map((question, index) => renderQuestion(question, index)).join('')}
            </div>
            <div class="mt-8 bg-dark-surface rounded-lg p-6 border border-dark-border">
                <button id="submit-quiz-btn" onclick="submitQuiz()" class="w-full bg-green-600 hover:bg-green-700 text-white px-6 py-4 rounded-lg font-semibold text-lg transition-colors">
                    Submit Quiz
                </button>
            </div>
        </div>
    `;
    if (quizData.time_limit_minutes && quizAttempt) startQuizTimer();
}

function renderQuestion(question, index) {
    const qid = Number(question.id);
    return `
        <div class="bg-dark-surface rounded-lg p-6 border border-dark-border">
            <div class="flex items-start space-x-3 mb-4">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center flex-shrink-0">
                    <span class="text-white font-semibold">${Number(index) + 1}</span>
                </div>
                <div class="flex-1">
                    <p class="text-lg font-medium mb-1">${escapeHtml(question.question_text)}</p>
                    <p class="text-sm text-gray-400">${escapeHtml(question.marks)} mark${question.marks > 1 ? 's' : ''}</p>
                </div>
            </div>
            <div class="space-y-2 ml-11">
                ${question.options.map(option => `
                    <label class="flex items-center p-4 bg-dark-bg hover:bg-dark-hover border border-dark-border rounded-lg cursor-pointer transition-colors">
                        <input type="radio" name="question_${qid}" value="${Number(option.id)}"
                               onchange="selectAnswer(${qid}, ${Number(option.id)})"
                               class="w-4 h-4 text-blue-600 focus:ring-2 focus:ring-blue-500" />
                        <span class="ml-3 text-gray-300">${escapeHtml(option.option_text)}</span>
                    </label>
                `).join('')}
            </div>
        </div>
    `;
}

function selectAnswer(questionId, optionId) {
    quizAnswers[questionId] = optionId;
    // Save each answer immediately (ASM-02): if time runs out, the server grades
    // exactly what was saved in time and ignores anything posted later.
    if (!quizAttempt) return;
    apiRequest(`/assessments/quiz/attempt/${Number(quizAttempt.id)}/answer/submit/`, {
        method: 'POST',
        body: JSON.stringify({ question_id: questionId, option_id: optionId }),
    }).catch(error => {
        if (error.status === 409) {
            clearInterval(quizTimerInterval);
            showAlert('Time is up — your saved answers were submitted.', 'warning');
            showQuizOutcome(null);
        }
    });
}

function startQuizTimer() {
    const timerElement = document.getElementById('quiz-timer');
    if (!timerElement) return;
    clearInterval(quizTimerInterval);

    const startTime = new Date(quizAttempt.started_at);
    const limit = quizData.time_limit_minutes * 60;
    quizAttempt.time_remaining_seconds = Math.max(0, limit - Math.floor((Date.now() - startTime) / 1000));

    const updateTimer = () => {
        const remaining = quizAttempt.time_remaining_seconds;
        const minutes = Math.floor(remaining / 60);
        const seconds = remaining % 60;
        timerElement.querySelector('span').textContent =
            `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        if (remaining <= 0) {
            clearInterval(quizTimerInterval);
            showAlert('Time is up! Submitting quiz...', 'warning');
            submitQuiz(true);
        } else {
            quizAttempt.time_remaining_seconds--;
        }
    };
    updateTimer();
    quizTimerInterval = setInterval(updateTimer, 1000);
}

async function submitQuiz(force = false) {
    try {
        const answeredCount = Object.keys(quizAnswers).length;
        const totalCount = quizData.questions.length;
        if (!force && answeredCount < totalCount &&
            !confirm(`You have answered ${answeredCount} out of ${totalCount} questions. Submit anyway?`)) {
            return;
        }
        clearInterval(quizTimerInterval);
        const btn = document.getElementById('submit-quiz-btn');
        if (btn) btn.disabled = true;
        const result = await apiRequest(`/assessments/quiz/attempt/${Number(quizAttempt.id)}/submit/`, {
            method: 'POST',
            body: JSON.stringify({ answers: quizAnswers }),
        });
        showAlert('Quiz submitted!', 'success');
        await showQuizOutcome(result);
    } catch (error) {
        console.error('Error submitting quiz:', error);
        // Already graded (e.g. auto-submitted when time ran out): show the outcome.
        if (error.status === 400 && /already submitted/i.test(error.message || '')) {
            await showQuizOutcome(null);
            return;
        }
        showAlert(error.message || 'Failed to submit quiz', 'error');
        const btn = document.getElementById('submit-quiz-btn');
        if (btn) btn.disabled = false;
    }
}

/** Refresh attempt status from the server, then show the result. */
async function showQuizOutcome(result) {
    try {
        quizData = await apiRequest(`/assessments/quiz/lesson/${Number(currentLesson.id)}/`);
    } catch (error) {
        console.error('Error refreshing quiz status:', error);
    }
    const status = attemptStatus();
    const outcome = result || status.last_attempt || {};
    renderQuizResults(outcome, status);
    if (outcome.passed) {
        setTimeout(() => markLessonComplete(), 1500);
    }
}

function renderQuizResults(result, status) {
    const contentArea = document.getElementById('lesson-content');
    const totalMarks = quizData.total_marks || quizData.questions.reduce((sum, q) => sum + (q.marks || 1), 0);
    const score = Number(result.score) || 0;
    const percentage = totalMarks > 0 ? Math.round((score / totalMarks) * 100) : 0;
    const passed = Boolean(result.passed);  // decided by the server's passing percentage
    const canRetry = !passed && status.can_start;

    contentArea.innerHTML = `
        <div class="max-w-4xl mx-auto">
            <div class="bg-dark-surface rounded-lg p-8 border border-dark-border text-center">
                <h3 class="text-2xl font-bold mb-2">${passed ? 'Quiz Passed!' : 'Quiz Not Passed'}</h3>
                <p class="text-gray-400 mb-2">You scored ${escapeHtml(score)} out of ${escapeHtml(totalMarks)} marks</p>
                ${result.is_auto_submitted ? '<p class="text-sm text-yellow-400 mb-4">Time ran out — only answers saved in time were graded.</p>' : ''}
                <div class="bg-dark-bg rounded-lg p-6 my-6">
                    <div class="text-6xl font-bold ${passed ? 'text-green-400' : 'text-red-400'} mb-2">${escapeHtml(percentage)}%</div>
                    <p class="text-gray-400">Pass mark: ${escapeHtml(quizData.passing_percentage ?? 50)}%</p>
                </div>
                ${passed ? '' : `
                    <p class="text-sm text-gray-400 mb-4">Attempts: ${escapeHtml(attemptsLabel(status))}</p>
                    ${canRetry ? `
                        <button onclick="startQuiz()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-semibold">
                            Try Again
                        </button>` : `
                        <p class="text-sm text-red-400">No attempts left. Contact your instructor if you need another attempt.</p>`}
                `}
            </div>
        </div>
    `;
}
</script>
