{% extends 'base.html' %}

{% block title %}Take Exam - SkillStudio{% endblock %}

{% block main_classes %}p-0{% endblock %}

{% block content %}
<div class="min-h-screen bg-dark-bg pb-24">
    <!-- Header with Timer -->
    <div class="bg-dark-surface border-b border-dark-border sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 sm:py-4">
            <div class="flex items-center justify-between gap-4">
                <div class="min-w-0">
                    <h1 id="exam-title" class="text-lg sm:text-2xl font-bold mb-1 break-words">Loading...</h1>
                    <p id="exam-info" class="text-sm text-gray-400 truncate sm:whitespace-normal">Preparing your exam</p>
                </div>
                <div class="flex shrink-0 items-center gap-6">
                    <!-- Timer -->
                    <div class="flex items-center space-x-3 px-4 py-2 bg-dark-bg rounded-lg">
                        <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <span id="timer" class="text-xl font-mono font-semibold">--:--</span>
                    </div>
                    <!-- Submit Button (phones use the bottom bar's button) -->
                    <button data-click="submitExam" class="hidden sm:inline-block px-6 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg font-semibold transition-colors">
                        Submit Exam
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Progress Bar -->
    <div class="max-w-7xl mx-auto px-6 py-4">
        <div class="flex items-center justify-between mb-2 text-sm text-gray-400">
            <span>Progress</span>
            <span id="progress-text">0/0 answered</span>
        </div>
        <p id="answer-save-status" class="text-sm text-gray-400 mt-2" role="status"></p>
        <div class="w-full bg-dark-surface rounded-full h-2">
            <div id="progress-bar" class="bg-blue-600 h-2 rounded-full transition-all" style="width: 0%"></div>
        </div>
    </div>

    <!-- Questions -->
    <div class="max-w-7xl mx-auto px-6 py-6">
        <div id="questions-container" class="space-y-8">
            <!-- Questions will be loaded here -->
        </div>
        
        <!-- Loading State -->
        <div id="loading-state" class="text-center py-16">
            <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-blue-500 mx-auto mb-4"></div>
            <p class="text-gray-400">Loading exam...</p>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="fixed bottom-0 left-0 right-0 bg-dark-surface border-t border-dark-border">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <button data-click="leaveExam"
                    class="px-6 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-semibold transition-colors">
                    Exit Exam
                </button>
                <button data-click="submitExam" class="px-8 py-3 bg-green-600 hover:bg-green-700 text-white rounded-lg font-semibold transition-colors text-lg">
                    Submit Exam
                </button>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script nonce="{{ csp_nonce }}">
let examId = null;
let attemptId = null;
let exam = null;
let questions = [];
let answers = Object.create(null);
let pendingAnswers = Object.create(null);
let saveRequest = null;
let saveInterval = null;
let submitting = false;
let leaving = false;
let timerInterval = null;
let timeRemaining = 0;
let deadline = 0;

// Uses the global cookie/CSRF-aware apiRequest() defined in base.html.

function getUrlParams() {
    const params = new URLSearchParams(window.location.search);
    const pathParts = window.location.pathname.split('/');
    examId = pathParts[pathParts.indexOf('take') + 1];
    attemptId = params.get('attempt');
}

async function loadExam() {
    const loadingState = document.getElementById('loading-state');
    try {
        exam = await apiRequest(`/exams/${examId}/?attempt=${encodeURIComponent(attemptId)}`);
        if (exam.attempt?.status === 'completed') {
            showResults();
            return;
        }
        if (exam.questions_hidden || exam.attempt?.status !== 'in_progress') {
            throw new Error('This attempt is no longer available.');
        }
        
        document.getElementById('exam-title').textContent = exam.title;
        document.getElementById('exam-info').textContent = `${exam.course_name} • ${exam.attempt.total_marks} marks`;
        answers = Object.assign(Object.create(null), exam.attempt.answers);
        const questionsById = new Map(
            [...exam.questions, ...exam.custom_questions].map(question => [question.id, question])
        );
        questions = exam.question_order.map(id => questionsById.get(id));
        
        loadingState.classList.add('hidden');
        renderQuestions();
        
        deadline = performance.now() + exam.attempt.time_remaining * 1000;
        startTimer();
        saveInterval = setInterval(autoSaveAnswers, 5000);
        
    } catch (error) {
        console.error('Error loading exam:', error);
        loadingState.innerHTML = `
            <div class="text-center py-16">
                <p class="text-red-500 mb-4">${escapeHtml(error.message || 'Failed to load exam')}</p>
                <a href="/exams/" class="text-blue-500 hover:underline">Return to exams</a>
            </div>
        `;
    }
}

function renderQuestions() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';
    
    questions.forEach((question, index) => {
        const questionCard = createQuestionCard(question, index + 1);
        container.appendChild(questionCard);
    });
    
    updateProgress();
}

function createQuestionCard(question, number) {
    const card = document.createElement('div');
    card.className = 'bg-dark-surface border border-dark-border rounded-xl p-6';
    card.id = `question-${question.id}`;
    
    const options = question.options || [];
    
    card.innerHTML = `
        <div class="flex items-start justify-between gap-3 mb-4">
            <div class="flex items-start gap-3 min-w-0">
                <span class="flex shrink-0 items-center justify-center w-8 h-8 rounded-full bg-blue-600 text-white font-semibold text-sm">
                    ${escapeHtml(number)}
                </span>
                <h3 class="text-lg font-semibold break-words">${escapeHtml(question.question_text)}</h3>
            </div>
            <span class="shrink-0 whitespace-nowrap px-3 py-1 bg-blue-900/30 text-blue-400 text-sm rounded-full">${escapeHtml(question.marks)} ${escapeHtml(question.marks == 1 ? 'mark' : 'marks')}</span>
        </div>
        
        <div class="space-y-3 sm:ml-11">
            ${options.map((option, optIndex) => `
                <label class="flex items-start p-4 bg-dark-bg border-2 border-dark-border rounded-lg cursor-pointer hover:border-blue-500 transition-all option-label">
                    <input type="radio" 
                        name="question-${escapeHtml(question.id)}" 
                        value="${escapeHtml(optIndex)}"
                        ${String(answers[question.id]) === String(optIndex) ? 'checked' : ''}
                        class="mt-1 w-5 h-5 text-blue-600 focus:ring-2 focus:ring-blue-500">
                    <span class="ml-3 flex-1 text-gray-200">${escapeHtml(option.text || option)}</span>
                </label>
            `).join('')}
        </div>
    `;
    
    card.querySelectorAll('input').forEach(input => {
        input.addEventListener('change', () => selectAnswer(question.id, Number(input.value)));
    });
    return card;
}

function selectAnswer(questionId, optionIndex) {
    answers[questionId] = optionIndex;
    pendingAnswers[questionId] = optionIndex;
    updateProgress();
    
    // Visual feedback
    const questionCard = document.getElementById(`question-${questionId}`);
    questionCard.classList.add('border-green-500');
    autoSaveAnswers();
}

function updateProgress() {
    const answered = questions.filter(question => answers[question.id] != null).length;
    const total = questions.length;
    const percentage = total > 0 ? (answered / total) * 100 : 0;
    
    document.getElementById('progress-bar').style.width = `${percentage}%`;
    document.getElementById('progress-text').textContent = `${answered}/${total} answered`;
}

function startTimer() {
    function tick() {
        timeRemaining = Math.max(0, Math.ceil((deadline - performance.now()) / 1000));
        updateTimerDisplay();
        if (timeRemaining <= 0) {
            clearInterval(timerInterval);
            timerInterval = null;
            submitExam(true);
        }
    }
    timerInterval = setInterval(tick, 250);
    tick();
}

function updateTimerDisplay() {
    const minutes = Math.floor(timeRemaining / 60);
    const seconds = timeRemaining % 60;
    const timerElement = document.getElementById('timer');
    timerElement.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    
    // Change color when time is running out
    if (timeRemaining <= 300) {
        timerElement.classList.add('text-red-500');
        timerElement.classList.remove('text-white');
    }
}

function autoSaveAnswers() {
    if (submitting || leaving || saveRequest || !Object.keys(pendingAnswers).length) return;
    const batch = pendingAnswers;
    pendingAnswers = Object.create(null);
    const status = document.getElementById('answer-save-status');
    status.textContent = 'Saving answers…';
    saveRequest = apiRequest(`/exams/${examId}/save-answers/`, {
        method: 'POST',
        body: JSON.stringify({attempt_id: attemptId, answers: batch})
    }).then(result => {
        if (result.status === 'completed') showResults();
        if (!Object.keys(pendingAnswers).length) status.textContent = 'Answers saved';
        return true;
    }).catch(() => {
        // Keep any newer selections made while the request was in flight.
        pendingAnswers = Object.assign(Object.create(null), batch, pendingAnswers);
        status.textContent = 'Answers haven’t saved yet. Retrying…';
        return false;
    }).then(saved => {
        saveRequest = null;
        if (saved) autoSaveAnswers();
    });
}

function showResults() {
    leaving = true;
    clearInterval(timerInterval);
    clearInterval(saveInterval);
    window.location.href = `/exams/results/${examId}/?attempt=${attemptId}`;
}

async function submitExam(autoSubmit = false) {
    if (submitting || leaving) return;
    if (!autoSubmit) {
        const answered = questions.filter(question => answers[question.id] != null).length;
        const total = questions.length;
        
        if (answered < total) {
            if (!await showConfirm(`You have only answered ${answered} out of ${total} questions. Submit anyway?`)) {
                return;
            }
        } else {
            if (!await showConfirm('Are you sure you want to submit your exam? This action cannot be undone.')) {
                return;
            }
        }
    }
    if (submitting || leaving) return; // The timer may have submitted while the dialog was open.

    try {
        submitting = true;
        clearInterval(timerInterval);
        timerInterval = null;
        await saveRequest;
        if (leaving) return;
        await apiRequest(`/exams/${examId}/submit/`, {
            method: 'POST',
            body: JSON.stringify({attempt_id: attemptId, answers})
        });
        showResults();
    } catch (error) {
        submitting = false;
        showAlert(error.message || 'Failed to submit exam. Please try again.', 'error');
        if (performance.now() < deadline) {
            startTimer();
        }
    }
}

// Prevent accidental page close
window.addEventListener('beforeunload', (e) => {
    if (!leaving && (timerInterval || saveRequest || Object.keys(pendingAnswers).length)) {
        e.preventDefault();
        e.returnValue = 'You have an exam in progress. Are you sure you want to leave?';
        return e.returnValue;
    }
});

document.addEventListener('DOMContentLoaded', function() {
    // Check authentication
    
    getUrlParams();
    
    // Validate attemptId is a valid number
    if (!examId || !attemptId || attemptId === 'undefined' || isNaN(attemptId)) {
        showAlert('Invalid exam or attempt ID', 'error');
        window.location.href = '/exams/';
        return;
    }
    
    // Convert attemptId to number
    attemptId = parseInt(attemptId);
    
    loadExam();
});

bindActions({
    click: {
        submitExam: () => submitExam(),
        leaveExam: async () => {
            if (await showConfirm('Are you sure you want to leave this exam?')) {
                leaving = true;
                window.location.href = '/exams/';
            }
        },
    },
});
</script>

<style>
.option-label:has(input:checked) {
    border-color: #3b82f6;
    background-color: rgba(59, 130, 246, 0.1);
}
</style>
{% endblock %}
