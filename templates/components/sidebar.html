            </div>

            <!-- Learning Section -->
            <div class="mb-4" id="learning-section">
                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Learning</h3>
                <a href="/courses/" class="sidebar-link flex items-center space-x-3 px-3 py-2 rounded-lg hover:bg-dark-hover transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                    </svg>
                    <span>My Courses</span>
                </a>
                <a href="/enrollments/" class="sidebar-link flex items-center space-x-3 px-3 py-2 rounded-lg hover:bg-dark-hover transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                    </svg>
                    <span>Enrollments</span>
                </a>

                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/>
                    </svg>
                    <span>Certificates</span>
                </a>
                <a href="/wallet/" class="sidebar-link flex items-center space-x-3 px-3 py-2 rounded-lg hover:bg-dark-hover transition-colors">

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <span>My Wallet</span>
                </a>
            </div>

            <!-- Teaching Section (Instructors only) -->
            <div class="mb-4 hidden" id="teaching-section">
                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Teaching</h3>
                <a href="/instructor/courses/" class="sidebar-link flex items-center space-x-3 px-3 py-2 rounded-lg hover:bg-dark-hover transition-colors">

            <!-- Community Section -->
            <div class="mb-4">
                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Community</h3>
                <a href="/exams/" class="sidebar-link flex items-center space-x-3 px-3 py-2 rounded-lg hover:bg-dark-hover transition-colors">

            <div class="mb-4">
                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Settings</h3>
                <a href="/profile/" id="sidebar-profile-link" class="sidebar-link flex items-center space-x-3 px-3 py-2 rounded-lg hover:bg-dark-hover transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">

        </nav>
    </div>
</aside>

<!-- Sidebar Overlay (Mobile) -->
<div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 lg:hidden hidden"></div>

<!-- Sidebar Toggle Button (Mobile) -->
<button id="sidebar-toggle" class="fixed bottom-4 right-4 lg:hidden w-14 h-14 bg-blue-600 rounded-full shadow-lg flex items-center justify-center z-50 hover:bg-blue-700 transition-colors">
    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
</button>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebar-overlay');
    const sidebarToggle = document.getElementById('sidebar-toggle');
    
    // Toggle sidebar on mobile
    sidebarToggle?.addEventListener('click', function() {
        sidebar.classList.toggle('-translate-x-full');
        sidebarOverlay.classList.toggle('hidden');
    });
    
    // Close sidebar when clicking overlay
    sidebarOverlay?.addEventListener('click', function() {
        sidebar.classList.add('-translate-x-full');
        sidebarOverlay.classList.add('hidden');
    });
    
    // Update sidebar based on user role
    function updateSidebar() {
        const accessToken = localStorage.getItem('user');
        const user = localStorage.getItem('user') ? JSON.parse(localStorage.getItem('user')) : null;
        
        if (accessToken && user) {
            // Show profile section
            const profileSection = document.getElementById('sidebar-profile');
            const avatar = document.getElementById('sidebar-avatar');
            const username = document.getElementById('sidebar-username');
            const role = document.getElementById('sidebar-role');
            const profileLink = document.getElementById('sidebar-profile-link');
            const dashboardLink = document.getElementById('dashboard-link');
            
            if (profileSection && avatar && username && role) {
                profileSection.classList.remove('hidden');
                avatar.textContent = user.email?.charAt(0).toUpperCase() || 'U';
                username.textContent = user.email?.split('@')[0] || 'User';
                role.textContent = user.role || 'Student';
            }
            
            // Set dashboard link based on role
            if (dashboardLink) {
                if (user.role === 'instructor') {
                    dashboardLink.setAttribute('href', '/instructor/dashboard/');
                } else if (user.role === 'admin') {
                    dashboardLink.setAttribute('href', '/dashboard/');
                } else {
                    dashboardLink.setAttribute('href', '/dashboard/');
                }
            }
            
            // Set profile link based on role
            if (profileLink) {
                if (user.role === 'instructor' || user.role === 'admin') {
                    profileLink.setAttribute('href', '/instructor/profile/');
                } else {
                    profileLink.setAttribute('href', '/profile/');
                }
            }
            
            // Show role-specific sections
            if (user.role === 'instructor' || user.role === 'admin') {
                document.getElementById('teaching-section')?.classList.remove('hidden');
                // Hide learning section for instructors
                document.getElementById('learning-section')?.classList.add('hidden');
            }
        }
    }
    
    // Highlight active link
    function highlightActiveLink() {
        const currentPath = window.location.pathname;
        document.querySelectorAll('.sidebar-link').forEach(link => {
            if (link.getAttribute('href') === currentPath) {
                link.classList.add('bg-blue-600', 'text-white');
            }
        });
    }
    
    updateSidebar();
    highlightActiveLink();
});
</script>
