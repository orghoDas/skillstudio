<div id="alert-container" role="status" class="fixed top-20 right-4 z-50 space-y-2 max-w-md"></div>
<dialog id="confirm-dialog" aria-labelledby="confirm-message" class="w-full max-w-sm rounded-lg border border-dark-border bg-dark-surface p-6 text-gray-100 backdrop:bg-black/60">
    <form method="dialog">
        <p id="confirm-message" class="mb-5"></p>
        <div class="flex justify-end gap-3">
            <button value="cancel" autofocus class="rounded-lg border border-dark-border px-4 py-2">Cancel</button>
            <button value="confirm" class="rounded-lg bg-blue-600 px-4 py-2 font-medium text-white hover:bg-blue-700">Confirm</button>
        </div>
    </form>
</dialog>
<dialog id="text-prompt" aria-labelledby="text-prompt-label" class="w-full max-w-sm rounded-lg border border-dark-border bg-dark-surface p-6 text-gray-100 backdrop:bg-black/60">
    <form method="dialog">
        <label id="text-prompt-label" for="text-prompt-value" class="mb-3 block"></label>
        <div id="text-prompt-input"></div>
        <div class="mt-5 flex justify-end gap-3">
            <button value="cancel" formnovalidate class="rounded-lg border border-dark-border px-4 py-2">Cancel</button>
            <button value="confirm" class="rounded-lg bg-blue-600 px-4 py-2 text-white">Confirm</button>
        </div>
    </form>
</dialog>
