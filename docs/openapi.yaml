        can manage it. On update it can never change (SEC-05): ownership is checked on
        the module's *current* course, so allowing a new course would let an
        instructor inject their module into someone else's course.
      properties:
        course:
          type: integer
        title:
          type: string
          minLength: 1
          maxLength: 255
