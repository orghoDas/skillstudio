components:
  schemas:
    APIKey:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        label:
          type: string
          maxLength: 255
        prefix:
          type: string
          readOnly: true
        scopes:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        revoked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - created_at
      - id
      - is_active
      - label
      - last_used_at
      - prefix
      - revoked_at
      - scopes
    AccountProfileRequest:
      type: object
      description: Serializer for shared account-owned profile data.
      properties:
        first_name:
          type: string
          nullable: true
          maxLength: 100
        last_name:
          type: string
          nullable: true
          maxLength: 100
        full_name:
          type: string
          nullable: true
          maxLength: 255
        phone:
          type: string
          nullable: true
          maxLength: 20
        location:
          type: string
          nullable: true
          maxLength: 255
        bio:
          type: string
          nullable: true
        avatar:
          nullable: true
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        social_links: {}
        interests: {}
    AppliesToEnum:
      enum:
      - all
      - courses
      - specific
      type: string
      description: |-
        * `all` - All Courses
        * `courses` - Courses Only
        * `specific` - Specific Courses
    BlankEnum:
      enum:
      - ''
    CatalogLessonSummary:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        module:
          type: integer
        title:
          type: string
          maxLength: 255
        position:
          type: integer
          maximum: 2147483647
          minimum: 0
          default: 0
        is_free:
          type: boolean
        content_type:
          $ref: '#/components/schemas/ContentTypeEnum'
        duration_seconds:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Duration in seconds
        is_locked:
          type: boolean
          readOnly: true
      required:
      - id
      - is_locked
      - module
      - title
    CatalogModule:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        course:
          type: integer
        title:
          type: string
          maxLength: 255
        position:
          type: integer
          maximum: 2147483647
          minimum: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/CatalogLessonSummary'
          readOnly: true
        lesson_count:
          type: integer
          readOnly: true
      required:
      - course
      - created_at
      - id
      - lesson_count
      - lessons
      - title
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
