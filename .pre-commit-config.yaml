# Install once per clone:  pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: forbid-env-files
        name: Block committing .env files
        entry: ".env files must not be committed — use .env.example for placeholders"
        language: fail
        files: '(^|/)\.env(\..+)?$'
        exclude: '(^|/)\.env\.example$'
      - id: forbid-venv-and-bytecode
        name: Block committing virtualenvs and Python bytecode
        entry: "venv/ and *.pyc files must not be committed — they are machine-specific build output"
        language: fail
        files: '(^|/)(\.?venv|env)/|\.py[cod]$|(^|/)__pycache__/'
